name: Deploy
on: 
  push:
    branches: [ "main" ]
jobs:
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      HOST: 89.38.131.104
      USERNAME: root
      DIR_NAME: tg_prudikpmu
      GITHUB_PATH: git@github.com:AlexStinky/tg_prudikpmu
      BRANCH: main
      PM2_NAME: tg_prudikpmu

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.HOST }}
        username: ${{ env.USERNAME }}
        key: ${{ secrets.KEY }}
        port: 22
        script: |
          cd /opt/${{ env.DIR_NAME }}
          git fetch origin
          git checkout ${{ env.BRANCH }}
          git pull origin ${{ env.BRANCH }}
          npm install --production

          pm2 reload ${{ env.PM2_NAME }} --time || pm2 start bot.js --name ${{ env.PM2_NAME }} --time
          pm2 save