start_message: 'Добро пожаловать! Здесь вы можете оформить или продлить подписку на наш закрытый канал/чат.'

subscribe_button: '💳 Оформить подписку'
status_button: 'ℹ️ Моя подписка'
renew_button: '🔄 Продлить подписку'

done_button: 'Готово'
confirm_button: 'Подтвердить'
back_button: 'Назад'
close_button: 'Закрыть'
cancel_button: 'Отмена'

user_url: '<a href="tg://user?id=${id}">${username}</a>'
bot_url: 'https://t.me/${username}?start=${query}'
channel_url: '<a href="${url}">${title}</a>'

subscription_status_active: |
  ✅ <b>Ваша подписка активна!</b>
  📅 Срок действия до: <b>${expiresAt}</b>
  
  Спасибо, что вы с нами!

subscription_status_none: |
  ❌ <b>У вас нет активной подписки.</b>
  
  Оформите подписку, чтобы получить доступ в закрытый канал.

subscription_checkout_message: |
  🔐 <b>Оформление подписки</b>
  
  Для оплаты перейдите по защищенной ссылке через Stripe:

subscription_checkout_button: '💳 Перейти к оплате'

subscription_activated_title: |
  🎉 <b>Оплата успешно получена!</b>
  
  Ваша подписка активна до: <b>${expiresAt}</b>
  
  🔗 <b>Ваша персональная ссылка для входа:</b>
  ${inviteLink}
  
  <i>Обратите внимание: ссылка одноразовая и предназначена только для вас.</i>

subscription_reminder_title: |
  ⚠️ <b>Напоминание о подписке!</b>
  
  До окончания подписки осталось <b>${days} дн.</b> (до ${expiresAt}).
  Пожалуйста, продлите подписку заранее, чтобы не потерять доступ к каналу.

subscription_expired_title: |
  ⛔️ <b>Срок действия подписки истек</b>
  
  К сожалению, оплата не была продлена, и доступ к закрытому каналу приостановлен.
  Вы можете возобновить подписку в любой момент через меню бота!

