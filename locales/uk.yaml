start_message: 'Вітаємо! Тут ви можете оформити або продовжити підписку на наш закритий канал/чат.'

subscribe_button: '💳 Оформити підписку'
status_button: 'ℹ️ Моя підписка'
renew_button: '🔄 Продовжити підписку'
language_button: '🌐 Мова / Language'

done_button: 'Готово'
confirm_button: 'Підтвердити'
back_button: 'Назад'
close_button: 'Закрити'
cancel_button: 'Скасувати'

choose_language_title: 'Оберіть мову інтерфейсу:'
language_changed: 'Мову успішно змінено!'

user_url: '<a href="tg://user?id=${id}">${username}</a>'
bot_url: 'https://t.me/${username}?start=${query}'
channel_url: '<a href="${url}">${title}</a>'

subscription_status_active: |
  ✅ <b>Ваша підписка активна!</b>
  📅 Термін дії до: <b>${expiresAt}</b>
  
  Дякуємо, що залишаєтеся з нами!

subscription_status_none: |
  ❌ <b>У вас немає активної підписки.</b>
  
  Оформіть підписку, щоб отримати доступ до ексклюзивного закритого каналу.

subscription_checkout_message: |
  🔐 <b>Оформлення підписки</b>
  
  Для оплати перейдіть за безпечним посиланням через Stripe:

subscription_checkout_button: '💳 Перейти до оплати'

subscription_activated_title: |
  🎉 <b>Оплату успішно здійснено!</b>
  
  Ваша підписка активна до: <b>${expiresAt}</b>
  
  🔗 <b>Ваше персональне посилання для входу:</b>
  ${inviteLink}
  
  <i>Зверніть увагу: посилання одноразове і створене спеціально для вас.</i>

subscription_reminder_title: |
  ⚠️ <b>Нагадування про підписку!</b>
  
  До завершення вашої підписки залишилося <b>${days} дн.</b> (до ${expiresAt}).
  Будь ласка, продовжіть підписку заздалегідь, щоб не втратити доступ до закритого каналу.

subscription_expired_title: |
  ⛔️ <b>Термін дії підписки закінчився</b>
  
  На жаль, оплату не було продовжено, тому доступ до закритого каналу тимчасово закрито.
  Щоб повернутися, ви можете поновити підписку в будь-який момент через меню бота!
